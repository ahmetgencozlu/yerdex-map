<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Takip</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --text: #0f172a;
      --subtext: #64748b;
      --sheet-radius: 20px;
      --transition: 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* ── EKRAN ── */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 12px;
      padding: 24px;
    }

    .label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    /* ── TAKIP BUTONU ── */
    .btn-takip {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(37,99,235,.38), 0 2px 8px rgba(37,99,235,.18);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn-takip::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(37,99,235,.22);
      animation: pulse 2.4s ease infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 1; }
      70%  { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .btn-takip:active { transform: scale(.94); background: var(--accent-dark); box-shadow: 0 4px 16px rgba(37,99,235,.3); }
    .btn-takip.open   { background: var(--accent-dark); box-shadow: 0 4px 16px rgba(37,99,235,.3); }

    /* ── OVERLAY ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0);
      pointer-events: none;
      transition: background var(--transition);
      z-index: 10;
    }
    .overlay.visible {
      background: rgba(0,0,0,.35);
      pointer-events: all;
    }

    /* ── BOTTOM SHEET ── */
    .sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
      padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
      transform: translateY(100%);
      transition: transform var(--transition);
      z-index: 20;
      will-change: transform;
      box-shadow: 0 -4px 24px rgba(0,0,0,.12);
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #cbd5e1;
      margin: 12px auto 4px;
    }

    .sheet-title {
      padding: 12px 20px 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--subtext);
    }

    /* ── SEÇENEKLER ── */
    .sheet-options { list-style: none; padding: 4px 12px 8px; }

    .sheet-option {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 12px;
      border: none;
      background: transparent;
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      border-radius: 14px;
      cursor: pointer;
      transition: background .12s ease;
      text-align: left;
      -webkit-user-select: none;
      user-select: none;
    }
    .sheet-option:active { background: #f1f5f9; }

    .option-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .sheet-option.selected .option-icon { box-shadow: 0 0 0 2px var(--accent); }

    .opt-1 .option-icon { background: #dbeafe; }
    .opt-2 .option-icon { background: #dcfce7; }
    .opt-3 .option-icon { background: #fef9c3; }

    .option-desc {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--subtext);
      margin-top: 2px;
    }

    .check {
      margin-left: auto;
      color: var(--accent);
      font-size: 20px;
      opacity: 0;
      transition: opacity .15s;
    }
    .sheet-option.selected .check { opacity: 1; }

    /* ── SEÇIM BADGE ── */
    .badge {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      min-height: 20px;
      text-align: center;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .25s, transform .25s;
    }
    .badge.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="screen">
  <span class="label">Mod Seçimi</span>

  <button class="btn-takip" id="btnTakip" aria-haspopup="true" aria-expanded="false">
    Takip
  </button>

  <div class="badge" id="badge"></div>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" role="presentation"></div>

<!-- Bottom Sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Takip modu seçin">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Takip Modunu Seç</div>
  <ul class="sheet-options" role="listbox">

    <li role="option">
      <button class="sheet-option opt-1" data-value="Yakın Takip" data-idx="0">
        <div class="option-icon">🎯</div>
        <div>
          Yakın Takip
          <span class="option-desc">Kısa mesafe, anlık izleme</span>
        </div>
        <span class="check" aria-hidden="true">✓</span>
      </button>
    </li>

    <li role="option">
      <button class="sheet-option opt-2" data-value="Uzun Takip" data-idx="1">
        <div class="option-icon">🗺️</div>
        <div>
          Uzun Takip
          <span class="option-desc">Geniş alan, rota analizi</span>
        </div>
        <span class="check" aria-hidden="true">✓</span>
      </button>
    </li>

    <li role="option">
      <button class="sheet-option opt-3" data-value="Ekran Takibi" data-idx="2">
        <div class="option-icon">📱</div>
        <div>
          Ekran Takibi
          <span class="option-desc">Ekran aktivitesi izleme</span>
        </div>
        <span class="check" aria-hidden="true">✓</span>
      </button>
    </li>

  </ul>
</div>

<script>
  const btn     = document.getElementById('btnTakip');
  const sheet   = document.getElementById('sheet');
  const overlay = document.getElementById('overlay');
  const badge   = document.getElementById('badge');
  const options = document.querySelectorAll('.sheet-option');

  let isOpen = false;

  function open() {
    isOpen = true;
    sheet.classList.add('open');
    overlay.classList.add('visible');
    btn.classList.add('open');
    btn.setAttribute('aria-expanded', 'true');
    // İlk seçeneğe focus (erişilebilirlik)
    setTimeout(() => options[0].focus(), 320);
  }

  function close() {
    isOpen = false;
    sheet.classList.remove('open');
    overlay.classList.remove('visible');
    btn.classList.remove('open');
    btn.setAttribute('aria-expanded', 'false');
    btn.focus();
  }

  btn.addEventListener('click', () => isOpen ? close() : open());
  overlay.addEventListener('click', close);

  // Seçenek tıklama
  options.forEach(opt => {
    opt.addEventListener('click', () => {
      const value = opt.dataset.value;

      // Seçim işaretle
      options.forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');

      // Badge güncelle
      badge.textContent = '✓ ' + value + ' seçildi';
      badge.classList.add('show');

      // Buton metni güncelle
      btn.textContent = value.split(' ')[0]; // kısalt: "Yakın", "Uzun", "Ekran"

      close();
    });
  });

  // Klavye: ESC ile kapat
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen) close();
  });

  // Sheet swipe-down ile kapat
  let startY = 0;
  sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 60) close();
  }, { passive: true });
</script>
</body>
</html>
